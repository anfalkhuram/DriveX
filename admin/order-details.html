<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveX Admin | Order Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body class="admin-layout" data-admin-page="order-details">
  <div class="admin-shell">
    <div id="adminSidebar"></div>
    <div class="admin-main">
      <div id="adminTopbar"></div>
      <main class="admin-content">
        <section class="admin-page-hero mb-4">
          <h1 class="display-font mb-2" id="orderTitle">Order Details</h1>
          <p class="mb-0 text-soft" id="orderMeta"></p>
        </section>

        <div class="row g-4">
          <div class="col-lg-5">
            <div class="detail-panel">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="display-font mb-0">Order Summary</h4>
                <a href="orders.html" class="btn btn-outline-dark rounded-pill px-3">Back</a>
              </div>
              <div id="orderInfo"></div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="detail-panel">
              <h4 class="display-font mb-3">Order Items</h4>
              <div id="orderItems"></div>
            </div>
          </div>
          <div class="col-lg-3">
            <div class="detail-panel">
              <h4 class="display-font mb-3">Update Status</h4>
              <select class="form-select" id="detailStatus">
                <option>Pending</option>
                <option>Processing</option>
                <option>Shipped</option>
              </select>
              <p class="text-muted mt-3 mb-0">Status updates reflect in the UI state for this page session.</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
