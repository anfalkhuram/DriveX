<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveX Admin | Products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body class="admin-layout" data-admin-page="products">
  <div class="admin-shell">
    <div id="adminSidebar"></div>
    <div class="admin-main">
      <div id="adminTopbar"></div>
      <main class="admin-content">
        <section class="admin-page-hero mb-4">
          <div class="d-flex flex-wrap gap-3 justify-content-between align-items-center">
            <div>
              <h1 class="display-font mb-2">Products Management</h1>
              <p class="mb-0 text-soft">Bootstrap tables, add/edit modals, and static UI delete actions for catalog management.</p>
            </div>
            <button class="btn btn-light rounded-pill px-4" id="openAddProductModal" data-bs-toggle="modal" data-bs-target="#productModal">
              <i class="fa-solid fa-plus me-2"></i>Add Product
            </button>
          </div>
        </section>

        <section class="admin-table-card">
          <div class="row g-3 filter-row">
            <div class="col-md-8">
              <input type="search" class="form-control" id="productSearch" placeholder="Search by product name, brand, or SKU">
            </div>
            <div class="col-md-4">
              <select class="form-select" id="productStatusFilter">
                <option value="">All Statuses</option>
                <option value="Active">Active</option>
                <option value="Low Stock">Low Stock</option>
              </select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Brand</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Status</th>
                  <th class="text-end">Actions</th>
                </tr>
              </thead>
              <tbody id="productsTableBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div class="modal fade" id="productModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content border-0 rounded-5">
        <div class="modal-body p-4">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="display-font mb-0" id="productModalLabel">Add Product</h3>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <form id="productForm">
            <input type="hidden" id="productId">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Product Name</label>
                <input type="text" class="form-control" id="productName" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Brand</label>
                <input type="text" class="form-control" id="productBrand" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Category</label>
                <select class="form-select" id="productCategory" required>
                  <option value="engine">Engine</option>
                  <option value="brakes">Brakes</option>
                  <option value="tires">Tires</option>
                  <option value="oils">Oils</option>
                  <option value="accessories">Accessories</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Price</label>
                <input type="number" class="form-control" id="productPrice" required>
              </div>
              <div class="col-md-3">
                <label class="form-label">Stock</label>
                <input type="number" class="form-control" id="productStock" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Status</label>
                <select class="form-select" id="productStatus" required>
                  <option value="Active">Active</option>
                  <option value="Low Stock">Low Stock</option>
                </select>
              </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-outline-dark rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-danger rounded-pill px-4">Save Product</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/admin.js"></script>
</body>
</html>
