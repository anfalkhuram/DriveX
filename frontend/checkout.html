<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveX Spares | Checkout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="checkout">
  <div id="siteHeader"></div>
  <div class="toast-shell" id="toastShell"></div>

  <main>
    <section class="page-banner">
      <div class="container">
        <div class="page-banner-box">
          <h1 class="display-font mb-2">Checkout</h1>
          <p class="mb-0">Billing, shipping, and payment UI for a friction-free spare parts order flow.</p>
        </div>
      </div>
    </section>

    <section class="section-pad pt-4">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-7">
            <form class="summary-card needs-validation-js" id="checkoutForm" novalidate>
              <h3 class="display-font mb-4">Billing & Shipping</h3>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">First Name</label>
                  <input type="text" class="form-control" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Last Name</label>
                  <input type="text" class="form-control" required>
                </div>
                <div class="col-12">
                  <label class="form-label">Email</label>
                  <input type="email" class="form-control" required>
                </div>
                <div class="col-12">
                  <label class="form-label">Address</label>
                  <input type="text" class="form-control" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">City</label>
                  <input type="text" class="form-control" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">State</label>
                  <input type="text" class="form-control" required>
                </div>
                <div class="col-md-4">
                  <label class="form-label">ZIP Code</label>
                  <input type="text" class="form-control" required>
                </div>
              </div>

              <h4 class="display-font mt-5 mb-3">Payment Option</h4>
              <div class="row g-3">
                <div class="col-md-4">
                  <label class="payment-option active d-block">
                    <input type="radio" name="payment" class="form-check-input me-2" checked>
                    Card Payment
                  </label>
                </div>
                <div class="col-md-4">
                  <label class="payment-option d-block">
                    <input type="radio" name="payment" class="form-check-input me-2">
                    Cash on Delivery
                  </label>
                </div>
                <div class="col-md-4">
                  <label class="payment-option d-block">
                    <input type="radio" name="payment" class="form-check-input me-2">
                    Bank Transfer
                  </label>
                </div>
              </div>

              <div class="form-check mt-4">
                <input class="form-check-input" type="checkbox" id="checkoutAgree" required>
                <label class="form-check-label" for="checkoutAgree">I confirm this is a UI-only demo order.</label>
              </div>
              <button type="submit" class="btn btn-danger btn-lg rounded-pill px-4 mt-4">Place Order</button>
              <div class="form-feedback"></div>
            </form>
          </div>
          <div class="col-lg-5">
            <div id="checkoutSummary"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
