<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DriveX Spares | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body data-page="contact">
  <div id="siteHeader"></div>
  <div class="toast-shell" id="toastShell"></div>

  <main>
    <section class="page-banner">
      <div class="container">
        <div class="page-banner-box">
          <h1 class="display-font mb-2">Contact Us</h1>
          <p class="mb-0">Reach the team, submit a parts inquiry, and preview the store location on an embedded map.</p>
        </div>
      </div>
    </section>

    <section class="section-pad pt-4">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-5">
            <div class="contact-card h-100">
              <h3 class="display-font mb-4">Get in touch</h3>
              <div class="d-grid gap-3 mb-4">
                <div><strong>Address</strong><div class="text-muted-soft">Main Shahrah-e-Faisal, Karachi</div></div>
                <div><strong>Email</strong><div class="text-muted-soft">support@drivexspares.com</div></div>
                <div><strong>Phone</strong><div class="text-muted-soft">+92 300 4445500</div></div>
              </div>
              <form class="needs-validation-js" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" required>
                  </div>
                  <div class="col-md-6">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Subject</label>
                    <input type="text" class="form-control" required>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="5" required></textarea>
                  </div>
                </div>
                <button type="submit" class="btn btn-danger rounded-pill px-4 mt-4">Send Message</button>
                <div class="form-feedback"></div>
              </form>
            </div>
          </div>
          <div class="col-lg-7">
            <div class="contact-card h-100">
              <h3 class="display-font mb-4">Store Location</h3>
              <iframe
                class="map-frame"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
                src="https://www.google.com/maps?q=Shahrah-e-Faisal%20Karachi&z=13&output=embed"
                title="DriveX Spares map">
              </iframe>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="siteFooter"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
